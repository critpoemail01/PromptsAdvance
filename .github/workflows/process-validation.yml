name: Process validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: process-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static contracts and gates
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Validate prompt process
        shell: powershell
        run: |
          .\scripts\Test-PromptProcess.ps1

  lifecycle:
    name: Lifecycle end to end
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Exercise lifecycle state machine
        shell: powershell
        run: |
          .\scripts\Test-SoftwareLifecycle.ps1
          .\scripts\Test-ProgrammerControlledLifecycle.ps1
          .\scripts\Test-LifecycleMigration.ps1

  disposable-copy:
    name: Disposable-copy regression
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Validate in a disposable Git copy
        shell: powershell
        run: |
          .\scripts\Test-ProcessInDisposableCopy.ps1
